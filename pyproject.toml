[project]
name = "hermes"
version = "0.1.0"
description = "Hermes — A-stock analysis, screening, and portfolio tracking CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "akshare>=1.18.0",
    "ddgs>=9.14.2",
    "lxml>=6.1.0",
    "mcp>=1.27.1",
    "rich>=13.0.0",
    "requests>=2.33.1",
    "typer>=0.15.0",
]

[project.scripts]
hermes = "hermes.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]